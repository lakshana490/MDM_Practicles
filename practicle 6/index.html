<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Student Grade Calculator</h2>

        <input type="number" id="maths" placeholder="Enter Maths Marks">
        <input type="number" id="science" placeholder="Enter Science Marks">
        <input type="number" id="english" placeholder="Enter English Marks">

        <br>

        <button onclick="calculateGrade()">Calculate Result</button>

        <div id="result"></div>

    </div>

    <script>

        function calculateGrade() {

            // Get marks from input
            let maths = Number(document.getElementById("maths").value);
            let science = Number(document.getElementById("science").value);
            let english = Number(document.getElementById("english").value);

            // Calculate total
            let total = maths + science + english;

            // Calculate percentage
            let percentage = total / 3;

            // Calculate grade
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            // Display result
            document.getElementById("result").innerHTML =
                "<h3>Result</h3>" +
                "Total Marks: " + total + " / 300<br>" +
                "Percentage: " + percentage.toFixed(2) + "%<br>" +
                "Grade: " + grade;
        }

    </script>

</body>
</html>
