```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2026 - Register Now</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">

    <!-- Registration Section -->
    <section class="min-h-screen flex items-center justify-center px-6 py-10">

        <div class="w-full max-w-lg bg-slate-900 border border-cyan-500/40
                    rounded-2xl p-8 shadow-2xl">

            <!-- Heading -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-cyan-400 mb-3">
                    Register Now
                </h1>

                <p class="text-slate-400">
                    Register for TechFest 2026
                </p>
            </div>

            <!-- Registration Form -->
            <form action="sucessfully.html" method="get">

                <!-- Full Name -->
                <div class="mb-5">
                    <label class="block text-slate-300 font-medium mb-2">
                        Full Name
                    </label>

                    <input type="text"
                           placeholder="Enter your full name"
                           class="w-full px-4 py-3 bg-slate-800
                                  border border-slate-700 rounded-lg
                                  text-white placeholder-slate-500
                                  focus:outline-none focus:border-cyan-400">
                </div>

                <!-- Email -->
                <div class="mb-5">
                    <label class="block text-slate-300 font-medium mb-2">
                        Email Address
                    </label>

                    <input type="email"
                           placeholder="Enter your email"
                           class="w-full px-4 py-3 bg-slate-800
                                  border border-slate-700 rounded-lg
                                  text-white placeholder-slate-500
                                  focus:outline-none focus:border-cyan-400">
                </div>

                <!-- College -->
                <div class="mb-5">
                    <label class="block text-slate-300 font-medium mb-2">
                        College Name
                    </label>

                    <input type="text"
                           placeholder="Enter your college name"
                           class="w-full px-4 py-3 bg-slate-800
                                  border border-slate-700 rounded-lg
                                  text-white placeholder-slate-500
                                  focus:outline-none focus:border-cyan-400">
                </div>

                <!-- Branch -->
                <div class="mb-5">
                    <label class="block text-slate-300 font-medium mb-2">
                        Branch
                    </label>

                    <input type="text"
                           placeholder="e.g. CSE, IT, ECE"
                           class="w-full px-4 py-3 bg-slate-800
                                  border border-slate-700 rounded-lg
                                  text-white placeholder-slate-500
                                  focus:outline-none focus:border-cyan-400">
                </div>

                <!-- Event -->
                <div class="mb-6">
                    <label class="block text-slate-300 font-medium mb-2">
                        Select Event
                    </label>

                    <select
                        class="w-full px-4 py-3 bg-slate-800
                               border border-slate-700 rounded-lg
                               text-white focus:outline-none
                               focus:border-cyan-400">

                        <option>Select an event</option>
                        <option>Coding Competition</option>
                        <option>Robotics</option>
                        <option>Technical Quiz</option>
                        <option>Project Exhibition</option>

                    </select>
                </div>

                <!-- Register Button -->
                <button type="submit"
                        class="w-full py-3 rounded-lg
                               bg-cyan-500 text-slate-950
                               font-bold text-lg
                               hover:bg-cyan-400
                               transition duration-300">

                    Register Now

                </button>

            </form>

            <!-- Back Button -->
            <div class="text-center mt-6">
                <a href="index.html"
                   class="text-cyan-400 hover:text-cyan-300">
                    ← Back to Invitation
                </a>
            </div>

            <nav class="flex justify-center gap-5 mt-4 text-sm" aria-label="Page navigation">
                <a href="event.html" class="text-cyan-400 hover:text-cyan-300">Events</a>
                <a href="sucessfully.html" class="text-cyan-400 hover:text-cyan-300">Registration Status</a>
            </nav>

        </div>

    </section>

</body>
</html>
```
